<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7ec">
  <title>Toddle-Cation</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="house" viewBox="0 0 64 64"><path d="M7 30 32 9l25 21M13 26v28h38V26M26 54V38h12v16"/></symbol>
    <symbol id="mother" viewBox="0 0 64 64"><path d="M21 27c-4-16 5-21 11-21s15 5 11 21M23 22a9 9 0 0 0 18 0M15 56c1-13 7-20 17-20s16 7 17 20zM27 27h.1M37 27h.1M29 32q3 2 6 0"/></symbol>
    <symbol id="father" viewBox="0 0 64 64"><path d="M23 22a9 9 0 0 0 18 0c0-6-4-11-9-11s-9 5-9 11ZM23 19q9-8 18 0M15 56c1-13 7-20 17-20s16 7 17 20zM28 25h.1M36 25h.1M29 30q3 2 6 0"/></symbol>
    <symbol id="dog" viewBox="0 0 64 64"><path d="M20 20 10 15l-4 17 12 3M44 20l10-5 4 17-12 3M19 21q13-9 26 0v15q-2 17-13 17T19 36zM25 29h.1M39 29h.1M29 37h6l-3 3zM32 40v5m-5 1q5 5 10 0"/></symbol>
    <symbol id="cat" viewBox="0 0 64 64"><path d="M15 27 13 10l13 8q6-2 12 0l13-8-2 17q5 21-17 26Q10 48 15 27ZM24 31h.1M40 31h.1M29 37h6l-3 3zM32 40v3m-5 2q5 4 10 0M8 36l14 2M8 43l14-2M56 36l-14 2M56 43l-14-2"/></symbol>
    <symbol id="car" viewBox="0 0 64 64"><path d="M8 42v-9l7-3 7-13h20l8 13 6 3v9h-5M13 42H8m13 0h22M17 30h31M32 18v12"/><circle cx="17" cy="43" r="5"/><circle cx="47" cy="43" r="5"/></symbol>
    <symbol id="library" viewBox="0 0 64 64"><path d="M6 22 32 9l26 13zM10 26h44M10 52h44M7 56h50M15 26v26M24 26v26M40 26v26M49 26v26M29 52V34h6v18"/></symbol>
    <symbol id="park" viewBox="0 0 64 64"><path d="M8 54h48M23 54V31M14 30q-7-5-2-12 0-8 8-8 7-7 13 1 9 0 8 9 5 8-3 12-6 3-10-1-7 5-14-1ZM44 54V38m-7 0h15M39 38v-6h11v6"/></symbol>
    <symbol id="question" viewBox="0 0 64 64"><path d="M21 22c0-7 5-12 12-12s12 5 12 12c0 10-13 10-13 20M32 51h.1"/></symbol>
  </svg>
  <main class="app">
    <header>
      <p class="brand">Toddle-Cation <span aria-hidden="true">✿</span></p>
      <button class="voice-toggle" id="voice-toggle" type="button" aria-pressed="false">Turn voice on</button>
    </header>

    <section id="feelings-screen" aria-labelledby="feelings-title">
      <div class="heading">
        <p class="step">Let’s check in · 1 of 2</p>
        <h1 id="feelings-title">How do you feel today?</h1>
        <p>Pick a color that feels like you.</p>
        <button class="listen" type="button" data-speak="How do you feel today?">🔊 Hear the question</button>
      </div>
      <div class="flower" aria-label="Choose a feeling color">
        <button type="button" class="petal red" data-color="Red" aria-label="Red">Red</button>
        <button type="button" class="petal orange" data-color="Orange" aria-label="Orange">Orange</button>
        <button type="button" class="petal yellow" data-color="Yellow" aria-label="Yellow">Yellow</button>
        <button type="button" class="petal green" data-color="Green" aria-label="Green">Green</button>
        <button type="button" class="petal blue" data-color="Blue" aria-label="Blue">Blue</button>
        <button type="button" class="petal purple" data-color="Purple" aria-label="Purple">Purple</button>
        <button type="button" class="petal black" data-color="Black" aria-label="Black">Black</button>
        <button type="button" class="petal white" data-color="White" aria-label="White">White</button>
        <div class="flower-center">How do<br>you feel?</div>
      </div>
    </section>

    <section id="reasons-screen" aria-labelledby="reasons-title" hidden>
      <div class="heading">
        <p class="step">Let’s check in · 2 of 2</p>
        <h1 id="reasons-title" tabindex="-1">Why do you feel this way?</h1>
        <p>Pick one or more pictures. It’s okay not to know.</p>
        <button class="listen" type="button" data-speak="Why do you feel this way?">🔊 Hear the question</button>
      </div>
      <div class="choices" aria-label="Choose one or more reasons">
        <button type="button" class="choice" data-reason="House" aria-pressed="false"><svg aria-hidden="true"><use href="#house"/></svg><span>House</span></button>
        <button type="button" class="choice" data-reason="Mother" aria-pressed="false"><svg aria-hidden="true"><use href="#mother"/></svg><span>Mother</span></button>
        <button type="button" class="choice" data-reason="Father" aria-pressed="false"><svg aria-hidden="true"><use href="#father"/></svg><span>Father</span></button>
        <button type="button" class="choice" data-reason="Dog" aria-pressed="false"><svg aria-hidden="true"><use href="#dog"/></svg><span>Dog</span></button>
        <button type="button" class="choice" data-reason="Cat" aria-pressed="false"><svg aria-hidden="true"><use href="#cat"/></svg><span>Cat</span></button>
        <button type="button" class="choice" data-reason="Car" aria-pressed="false"><svg aria-hidden="true"><use href="#car"/></svg><span>Car</span></button>
        <button type="button" class="choice" data-reason="Library" aria-pressed="false"><svg aria-hidden="true"><use href="#library"/></svg><span>Library</span></button>
        <button type="button" class="choice" data-reason="Park" aria-pressed="false"><svg aria-hidden="true"><use href="#park"/></svg><span>Park</span></button>
        <button type="button" class="choice" data-reason="Not sure" aria-pressed="false"><svg aria-hidden="true"><use href="#question"/></svg><span>Not sure</span></button>
      </div>
      <div class="actions">
        <button id="back" class="secondary" type="button">← Change color</button>
        <button id="save" class="primary" type="button" disabled>Save my report</button>
      </div>
    </section>
    <p id="status" class="status" role="status"></p>
    <p class="privacy">Made with care · Your report stays on your device</p>
  </main>
</body>
</html>
